<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-container {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="number"] {
            width: 200px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <h1>Лабораторная работа 2</h1>
    
    <div class="form-container">
        <h2>Ввод параметров</h2>
        <form th:action="@{/result}" method="post">
            <div class="form-group">
                <label for="lamda1">Lambda 1:</label>
                <input type="number" id="lamda1" name="lamda1" step="0.1" value="2.0" required>
            </div>
            <div class="form-group">
                <label for="lamda2">Lambda 2:</label>
                <input type="number" id="lamda2" name="lamda2" step="0.1" value="3.0" required>
            </div>
            <button type="submit">Выполнить расчет</button>
        </form>
    </div>

    <div th:if="${result != null}">
        <h2>Результаты</h2>
        <table>
            <thead>
                <tr>
                    <th>Номер события i</th>
                    <th>Интервал τ[i]</th>
                    <th>Момент события t[i]</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="row : ${result.tau}">
                    <td th:text="${rowStat.index + 1}">Номер события</td>
                    <td th:text="${#numbers.formatDecimal(row, 1, 2)}">Интервал</td>
                    <td th:text="${#numbers.formatDecimal(result.t[rowStat.index], 1, 2)}">Момент</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
